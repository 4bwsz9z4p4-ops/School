<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>School – školní HTML materiály</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #17212e; }
    main { max-width: 860px; margin: 54px auto; padding: 0 20px 64px; }
    header { margin-bottom: 26px; }
    h1 { font-size: clamp(2rem, 5vw, 2.75rem); margin: 0 0 10px; letter-spacing: -.035em; }
    p { font-size: 1.05rem; color: #536274; line-height: 1.5; margin: 0; }
    ul { padding: 0; margin: 0; list-style: none; display: grid; gap: 10px; }
    a { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 17px 19px; border: 1px solid #dce3ed; border-radius: 12px; background: #fff; color: #174a86; text-decoration: none; font-weight: 650; transition: background .15s ease, border-color .15s ease; }
    a:hover, a:focus-visible { border-color: #376ba7; background: #eff6ff; outline-offset: 3px; }
    .arrow { flex: none; font-size: 1.25rem; color: #718096; }
    footer { margin-top: 25px; color: #65748a; font-size: .9rem; }
    @media (max-width: 600px) { main { margin: 28px auto; } a { padding: 15px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Školní materiály</h1>
      <p>Vyberte materiál. Kliknutím se otevře jeho interaktivní HTML stránka.</p>
    </header>
    <ul>
      <li><a href="Lapov%C3%A1n%C3%AD.html">Lapování<span class="arrow" aria-hidden="true">↗</span></a></li>
    </ul>
    <footer>School · GitHub Pages</footer>
  </main>
</body>
</html>
