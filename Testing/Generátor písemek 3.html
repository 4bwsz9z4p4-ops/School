<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generátor písemek 3 – kuželovitost</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17212e;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:36px auto;padding:0 20px 50px}h1{margin:0 0 8px}.lead{color:#5d6b7c;margin:0 0 24px}.layout{display:grid;grid-template-columns:minmax(290px,360px) minmax(0,1fr);gap:18px;align-items:start}.card{background:#fff;border:1px solid #dfe6ef;border-radius:14px;padding:20px}.settings{position:sticky;top:16px}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #bfccd8;border-radius:8px;padding:9px;font:inherit}.field textarea{min-height:100px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:1px solid #aebdcb;border-radius:8px;padding:10px 12px;background:#fff;cursor:pointer;font:inherit;font-weight:650}button.primary{background:#2165a5;border-color:#2165a5;color:#fff}button:hover{filter:brightness(.96)}.notice{font-size:12px;color:#667085;line-height:1.5}.variant{border:1px solid #dce3eb;border-radius:10px;padding:16px;margin:12px 0;break-inside:avoid}.variant h3{margin:0 0 10px}.identity{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:#344054;margin:10px 0 16px}.diagram{display:block;width:min(100%,560px);height:auto;margin:8px auto 16px}.work{min-height:80px;border:1px solid #e1e7ee;border-radius:7px;margin-top:6px;padding:10px}.solutions{break-before:page;margin-top:24px}.answer{border-bottom:1px solid #ddd;padding:8px 0;line-height:1.7}.answer code{font-family:ui-monospace,monospace;background:#f3f6f9;padding:2px 4px}@media(max-width:800px){.layout{grid-template-columns:1fr}.settings{position:static}}@media print{body{background:#fff}main{max-width:none;margin:0;padding:0}.layout{display:block}.settings,.preview>h2,.lead,main>h1{display:none!important}.card,.variant{border:0;padding:0}.variant{page-break-inside:avoid;margin-bottom:14mm}.solutions{page-break-before:always}.diagram{max-width:500px}}
  </style>
</head>
<body>
<main>
  <h1>Generátor písemek 3</h1>
  <p class="lead">Výpočet kuželovitosti a sklonu komolého kužele. Vytvoří náhodné varianty včetně nákresu a řešení.</p>
  <div class="layout">
    <section class="card settings">
      <h2>Nastavení</h2>
      <div class="field"><label for="count">Počet variant</label><input id="count" type="number" min="1" max="30" value="6"></div>
      <div class="field"><label for="title">Název písemky</label><input id="title" value="Písemka – kuželovitost"></div>
      <div class="field"><label for="bigMin">Větší průměr D (mm), od–do</label><div class="row"><input id="bigMin" type="number" min="2" value="70" aria-label="D od"><input id="bigMax" type="number" min="2" value="120" aria-label="D do"></div></div>
      <div class="field"><label for="smallMin">Menší průměr d (mm), od–do</label><div class="row"><input id="smallMin" type="number" min="1" value="20" aria-label="d od"><input id="smallMax" type="number" min="1" value="60" aria-label="d do"></div></div>
      <div class="field"><label for="lengthMin">Délka kužele L (mm), od–do</label><div class="row"><input id="lengthMin" type="number" min="1" value="100" aria-label="L od"><input id="lengthMax" type="number" min="1" value="300" aria-label="L do"></div></div>
      <div class="field"><label><input id="solutions" type="checkbox" checked style="width:auto"> Přidat řešení na samostatnou stránku</label></div>
      <div class="actions"><button class="primary" id="generate" type="button">Vygenerovat varianty</button><button id="download" type="button">Stáhnout .doc</button><button id="print" type="button">Tisk</button></div>
      <p class="notice">Kuželovitost K = (D − d) / L. Sklon kuželové plochy S = K / 2. Rozsahy průměrů se vybírají tak, aby D bylo vždy větší než d.</p>
    </section>
    <section class="card preview"><h2>Náhled</h2><div id="output" aria-live="polite"></div></section>
  </div>
</main>
<script>
'use strict';
let variants=[];
const $=id=>document.getElementById(id);
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function ratio(n,d){const g=gcd(n,d);return `${n/g}:${d/g}`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getSettings(){return {count:Math.min(30,Math.max(1,Number($('count').value)||6)),D0:Number($('bigMin').value),D1:Number($('bigMax').value),d0:Number($('smallMin').value),d1:Number($('smallMax').value),L0:Number($('lengthMin').value),L1:Number($('lengthMax').value)}}
function make(){
  const s=getSettings();
  if(![s.D0,s.D1,s.d0,s.d1,s.L0,s.L1].every(Number.isFinite)||s.D0<2||s.d0<1||s.L0<1||s.D1<s.D0||s.d1<s.d0||s.L1<s.L0||s.D1<=s.d0){alert('Zkontrolujte rozsahy. Průměry musí být kladné, D musí být větší než d a délka L musí být kladná.');return}
  variants=[];
  for(let i=0;i<s.count;i++){
    let D,d;
    for(let tries=0;tries<100;tries++){D=randInt(s.D0,s.D1);d=randInt(s.d0,s.d1);if(D>d)break}
    if(D<=d){alert('Z těchto rozsahů nelze sestavit variantu s D > d. Upravte rozsahy průměrů.');variants=[];return}
    variants.push({D,d,L:randInt(s.L0,s.L1)});
  }
  render();
}
function ratioText(n,d){const g=gcd(n,d);return `${n}/${d} = ${n/g}/${d/g} = 1:${d/g}`}
function diagram(v){
  const topL=65,topR=455,midY=125,bigR=78,smallR=45;
  const y1=midY-bigR,y2=midY+bigR,sy1=midY-smallR,sy2=midY+smallR;
  return `<svg class="diagram" viewBox="0 0 520 230" role="img" aria-label="Nákres komolého kužele: D ${v.D} milimetrů, d ${v.d} milimetrů, L ${v.L} milimetrů"><defs><marker id="arrow${v.i}" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#344054"/></marker></defs><path d="M${topL},${y1} L${topR},${sy1} L${topR},${sy2} L${topL},${y2} Z" fill="#f8fafc" stroke="#17212e" stroke-width="3"/><line x1="30" y1="${midY}" x2="490" y2="${midY}" stroke="#667085" stroke-dasharray="7 5"/><line x1="topL" y1="${y1}" x2="topL" y2="${y2}" stroke="#17212e" stroke-width="3"/><line x1="topR" y1="${sy1}" x2="topR" y2="${sy2}" stroke="#17212e" stroke-width="3"/><line x1="topL" y1="${y1}" x2="25" y2="${y1}" stroke="#98a2b3"/><line x1="topL" y1="${y2}" x2="25" y2="${y2}" stroke="#98a2b3"/><line x1="25" y1="${y1}" x2="25" y2="${y2}" stroke="#344054" marker-start="url(#arrow${v.i})" marker-end="url(#arrow${v.i})"/><text x="14" y="${midY+5}" text-anchor="end" font-size="16" fill="#17212e">D = ${v.D}</text><line x1="topR" y1="${sy1}" x2="495" y2="${sy1}" stroke="#98a2b3"/><line x1="topR" y1="${sy2}" x2="495" y2="${sy2}" stroke="#98a2b3"/><line x1="495" y1="${sy1}" x2="495" y2="${sy2}" stroke="#344054" marker-start="url(#arrow${v.i})" marker-end="url(#arrow${v.i})"/><text x="508" y="${midY+5}" font-size="16" fill="#17212e">d = ${v.d}</text><line x1="${topL}" y1="${y2+8}" x2="${topL}" y2="210" stroke="#98a2b3"/><line x1="${topR}" y1="${sy2+8}" x2="${topR}" y2="210" stroke="#98a2b3"/><line x1="${topL}" y1="202" x2="${topR}" y2="202" stroke="#344054" marker-start="url(#arrow${v.i})" marker-end="url(#arrow${v.i})"/><text x="260" y="195" text-anchor="middle" font-size="16" fill="#17212e">L = ${v.L}</text></svg>`;
}
function identity(){return '<div class="identity"><span>Jméno a příjmení: _________________________</span><span>Třída: __________</span><span>Datum: __________</span></div>'}
function solution(v,i){const delta=v.D-v.d;return `<div class="answer"><strong>Varianta ${i+1}:</strong><br>K = (D − d) / L = (${v.D} − ${v.d}) / ${v.L} = ${delta}/${v.L} = ${ratioText(delta,v.L)}.<br>S = K / 2 = ${delta}/(2 · ${v.L}) = ${ratioText(delta,2*v.L)}.<br><strong>Odpověď:</strong> Kužel má kuželovitost ${ratio(delta,v.L)} a sklon ${ratio(delta,2*v.L)}.</div>`}
function render(){const show=$('solutions').checked;$('output').innerHTML=variants.map((v,i)=>{v.i=i;return `<article class="variant"><h3>Varianta ${i+1}</h3>${identity()}<p>Vypočítejte kuželovitost a sklon komolého kužele dle obrázku.</p>${diagram(v)}<strong>Výpočet:</strong><div class="work"></div></article>`}).join('')+(show&&variants.length?`<section class="solutions"><h2>Řešení – ${esc($('title').value)}</h2>${variants.map(solution).join('')}</section>`:'')}
function docContent(){
  const title=esc($('title').value||'Písemka – kuželovitost');
  const questions=variants.map((v,i)=>{v.i=i;return `<article class="variant"><h2>Varianta ${i+1}</h2><div class="identity">Jméno a příjmení: _________________________ &nbsp; Třída: __________ &nbsp; Datum: __________</div><p>Vypočítejte kuželovitost a sklon komolého kužele dle obrázku.</p>${diagram(v)}<strong>Výpočet:</strong><div class="work"></div></article>`}).join('');
  const answers=$('solutions').checked?`<section class="solutions"><h1>Řešení – ${title}</h1>${variants.map(solution).join('')}</section>`:'';
  return `<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>${title}</title><style>@page{size:A4;margin:18mm 17mm}body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#17212e}.variant{page-break-inside:avoid;margin-bottom:12mm}.identity{font-size:9pt;margin:10px 0 15px}.diagram{display:block;width:100%;max-width:500px;height:auto;margin:10px auto 16px}.work{height:55px;border:1px solid #bbb;margin-top:5px}.solutions{page-break-before:always}.answer{padding:8px 0;border-bottom:1px solid #ddd;line-height:1.7}</style></head><body><h1>${title}</h1>${questions}${answers}</body></html>`;
}
$('generate').addEventListener('click',make);
$('solutions').addEventListener('change',render);
$('print').addEventListener('click',()=>window.print());
$('download').addEventListener('click',()=>{if(!variants.length)make();if(!variants.length)return;const blob=new Blob(['\ufeff',docContent()],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=($('title').value||'Pisemka').replace(/[\\/:*?"<>|]/g,'')+'.doc';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
make();
</script>
</body>
</html>
