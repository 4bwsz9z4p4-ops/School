<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generátor písemek 3 – kuželovitost</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17212e;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:36px auto;padding:0 20px 50px}h1{margin:0 0 8px}.lead{color:#526174;margin:0 0 24px}.layout{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:20px;align-items:start}.card{background:#fff;border:1px solid #dce4ee;border-radius:12px;padding:20px;box-shadow:0 4px 16px #2030400a}.settings{position:sticky;top:16px}.field{margin:0 0 14px}.field>label{display:block;font-weight:600;margin-bottom:6px}.field input:not([type=checkbox]){width:100%;padding:9px 10px;border:1px solid #bdc9d8;border-radius:6px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label:has(input[type=checkbox]){display:flex;align-items:center;gap:8px;font-weight:400}.actions{display:grid;gap:8px;margin:18px 0}.actions button{font:inherit;padding:10px 12px;border:1px solid #aebaca;border-radius:7px;background:#fff;cursor:pointer}.actions .primary{background:#1769aa;border-color:#1769aa;color:#fff;font-weight:650}.actions button:hover{filter:brightness(.96)}.notice{font-size:.9rem;line-height:1.5;color:#526174}.preview h2{margin:0 0 16px}.variant{padding:10px 0 24px;margin:0 0 20px;border-bottom:1px solid #dce4ee;break-after:page;page-break-after:always}.variant:last-child{border-bottom:0}.variant h3,.variant h2{margin:0 0 12px}.identity{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.92rem;margin:10px 0 16px}.prompt{margin:12px 0}.diagram{display:block;width:min(100%,560px);height:auto;margin:8px auto 16px}.answer{border:1px solid #cbd6e2;border-radius:7px;padding:12px 14px;margin:12px 0;line-height:1.7}.solutions{margin-top:24px;padding-top:20px;border-top:2px solid #7d8da0}.solutions h2{margin:0 0 16px}.answer strong{font-weight:700}@media(max-width:760px){.layout{grid-template-columns:1fr}.settings{position:static}main{margin-top:20px}}@media print{ :root{background:#fff}body{background:#fff}main{max-width:none;margin:0;padding:0}.layout{display:block}.settings,.preview>h2{display:none}.card{border:0;box-shadow:none;padding:0}.variant{min-height:240mm;padding:0 0 12mm;margin:0;border:0;break-after:page;page-break-after:always}.variant:last-child{break-after:auto;page-break-after:auto}.solutions{break-before:page;page-break-before:always}.diagram{max-width:145mm} }
  </style>
</head>
<body>
<main>
  <h1>Generátor písemek 3</h1>
  <p class="lead">Výpočet kuželovitosti a sklonu komolého kužele. Vytvoří náhodné varianty včetně jednoduchého nákresu a řešení.</p>
  <div class="layout">
    <section class="card settings">
      <h2>Nastavení</h2>
      <div class="field"><label for="count">Počet variant</label><input id="count" type="number" min="1" max="30" value="6"></div>
      <div class="field"><label for="title">Název písemky</label><input id="title" value="Písemka – kuželovitost"></div>
      <div class="field"><label for="bigMin">Větší průměr D (mm), od–do</label><div class="row"><input id="bigMin" type="number" min="2" value="70" aria-label="D od"><input id="bigMax" type="number" min="2" value="110" aria-label="D do"></div></div>
      <div class="field"><label for="smallMin">Menší průměr d (mm), od–do</label><div class="row"><input id="smallMin" type="number" min="1" value="20" aria-label="d od"><input id="smallMax" type="number" min="1" value="40" aria-label="d do"></div></div>
      <div class="field"><label for="lengthMin">Délka kužele L (mm), od–do</label><div class="row"><input id="lengthMin" type="number" min="1" value="100" aria-label="L od"><input id="lengthMax" type="number" min="1" value="300" aria-label="L do"></div></div>
      <div class="field"><label><input id="solutions" type="checkbox" checked> Přidat řešení na samostatnou stránku</label></div>
      <div class="actions"><button class="primary" id="generate" type="button">Vygenerovat varianty</button><button id="download" type="button">Stáhnout .doc</button><button id="print" type="button">Tisknout</button></div>
      <p class="notice">Kuželovitost K = (D − d) / L. Sklon komolého kužele S = K / 2. V nákresu jsou kóty oddělené od obrysu a osa vyznačená čerchovanou čarou.</p>
    </section>
    <section class="card preview"><h2>Náhled</h2><div id="output" aria-live="polite"></div></section>
  </div>
</main>
<script>
'use strict';
let variants=[];
const $=id=>document.getElementById(id);
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function gcd(a,b){while(b){[a,b]=[b,a%b]}return a}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function getSettings(){return {count:Math.min(30,Math.max(1,Number($('count').value)||6)),D0:Number($('bigMin').value),D1:Number($('bigMax').value),d0:Number($('smallMin').value),d1:Number($('smallMax').value),L0:Number($('lengthMin').value),L1:Number($('lengthMax').value)}}
function make(){
  const s=getSettings();
  if(![s.D0,s.D1,s.d0,s.d1,s.L0,s.L1].every(Number.isFinite)||s.D0<2||s.d0<1||s.L0<1||s.D1<s.D0||s.d1<s.d0||s.L1<s.L0||s.D1<=s.d0){alert('Zkontrolujte rozsahy. Průměry musí být kladné, D musí být vždy větší než d a dolní meze nesmí být vyšší než horní.');return}
  variants=[];
  for(let i=0;i<s.count;i++){
    let D,d;
    for(let tries=0;tries<100;tries++){D=randInt(s.D0,s.D1);d=randInt(s.d0,s.d1);if(D>d)break}
    if(D<=d){alert('Z těchto rozsahů nelze sestavit variantu s D > d. Upravte rozsahy průměrů.');variants=[];return}
    variants.push({D,d,L:randInt(s.L0,s.L1)});
  }
  render();
}
function formatRatio(value){const g=gcd(Math.round(value*1000),1000);const n=Math.round(value*1000)/g,d=1000/g;return d===1?String(n):`${n}:${d}`}
function diagram(v,i,mode='html'){
  const centerY=101,leftX=104,rightX=400,maxRadius=61;
  const radiusBig=maxRadius,radiusSmall=Math.max(16,maxRadius*v.d/v.D);
  const topL=centerY-radiusBig,bottomL=centerY+radiusBig,topR=centerY-radiusSmall,bottomR=centerY+radiusSmall;
  const marker=`arrow-${i}-${mode}`;
  return `<svg class="diagram" xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="Nákres komolého kužele"><defs><marker id="${marker}" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M8 1 1 4l7 3" fill="none" stroke="#222" stroke-width="1.2"/></marker></defs><g fill="none" stroke="#222" stroke-width="1.4"><path d="M${leftX} ${topL}V${bottomL} M${rightX} ${topR}V${bottomR}" stroke-width="2.6"/><path d="M${leftX} ${topL}L${rightX} ${topR} M${leftX} ${bottomL}L${rightX} ${bottomR}" stroke-width="2.6"/><path d="M58 ${centerY}H452" stroke="#666" stroke-dasharray="9 4 2 4"/><path d="M${leftX} ${topL}H35 M${leftX} ${bottomL}H35 M35 ${topL}V${bottomL}" marker-start="url(#${marker})" marker-end="url(#${marker})"/><path d="M${rightX} ${topR}H485 M${rightX} ${bottomR}H485 M485 ${topR}V${bottomR}" marker-start="url(#${marker})" marker-end="url(#${marker})"/><path d="M${leftX} ${bottomL}V207 M${rightX} ${bottomR}V207 M${leftX} 207H${rightX}" marker-start="url(#${marker})" marker-end="url(#${marker})"/></g><g fill="#111" font-family="Arial,sans-serif" font-size="17"><text x="19" y="${centerY}" text-anchor="middle" transform="rotate(-90 19 ${centerY})">D = ${v.D}</text><text x="505" y="${centerY}" text-anchor="middle" transform="rotate(-90 505 ${centerY})">d = ${v.d}</text><text x="252" y="197" text-anchor="middle">L = ${v.L}</text></g></svg>`;
}
function identity(){return '<div class="identity"><span>Jméno a příjmení: _________________________</span><span>Třída: __________</span><span>Datum: __________</span></div>'}
function solution(v,i){const delta=v.D-v.d;const kDen=v.L/delta;const sDen=2*v.L/delta;return `<div class="answer"><strong>Varianta ${i+1} – řešení</strong><br>K = (D − d) / L = (${v.D} − ${v.d}) / ${v.L} = ${delta}/${v.L} = 1:${formatRatio(kDen)}<br>S = K / 2 = 1:${formatRatio(sDen)}</div>`}
function question(v,i,mode='html'){
  return `<article class="variant"><h3>Varianta ${i+1}</h3>${identity()}<p class="prompt">Na obrázku je zobrazený komolý kužel s danými rozměry. Vypočítejte kuželovitost a sklon komolého kužele.</p>${diagram(v,i,mode)}<p>Výsledky zapište ve tvaru 1:x.</p></article>`;
}
function render(){const show=$('solutions').checked;$('output').innerHTML=variants.map((v,i)=>question(v,i,'preview')).join('')+(show&&variants.length?`<section class="solutions"><h2>Řešení</h2>${variants.map(solution).join('')}</section>`:'')}
function svgToPng(svg){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    image.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=1040;canvas.height=460;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/png'))}catch(error){URL.revokeObjectURL(url);reject(error)}};
    image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Nákres se nepodařilo připravit pro dokument.'))};
    image.src=url;
  });
}
async function docContent(){
  const title=esc($('title').value||'Písemka – kuželovitost');
  const preview=$('output').cloneNode(true);
  for(const svg of preview.querySelectorAll('svg.diagram')){
    const png=await svgToPng(new XMLSerializer().serializeToString(svg));
    const image=document.createElement('img');
    image.className=svg.getAttribute('class')||'diagram';
    image.alt=svg.getAttribute('aria-label')||'Nákres komolého kužele';
    image.src=png;
    svg.replaceWith(image);
  }
  return `<!doctype html><html lang="cs"><head><meta charset="utf-8"><title>${title}</title><style>@page{size:A4;margin:18mm 17mm}body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#17212e}.variant{padding:10px 0 24px;margin:0 0 20px;border-bottom:1px solid #dce4ee;page-break-after:always;break-after:page}.variant h3,.variant h2{margin:0 0 12px}.identity{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10pt;margin:10px 0 16px}.prompt{margin:12px 0}.diagram{display:block;width:100%;max-width:148mm;height:auto;margin:8px auto 16px}.answer{border:1px solid #cbd6e2;padding:12px 14px;margin:12px 0;line-height:1.7}.solutions{margin-top:24px;padding-top:20px;border-top:2px solid #7d8da0;page-break-before:always;break-before:page}.solutions h2{margin:0 0 16px}</style></head><body>${preview.innerHTML}</body></html>`;
}
$('generate').addEventListener('click',make);
$('solutions').addEventListener('change',render);
$('print').addEventListener('click',()=>window.print());
$('download').addEventListener('click',async()=>{
  if(!variants.length)make();
  if(!variants.length)return;
  const button=$('download');button.disabled=true;
  try{
    const blob=new Blob(['\ufeff',await docContent()],{type:'application/msword'}),url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=($('title').value||'pisemka').replace(/[^\p{L}\p{N}-]+/gu,'_')+'.doc';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }catch(error){alert(error.message||'Dokument se nepodařilo vytvořit.');}
  finally{button.disabled=false;}
});
make();
</script>
</body>
</html>
